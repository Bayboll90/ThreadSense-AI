<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>ThreadSense AI</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!--
    Главный экран: режим, старт-стоп, что сделано сегодня, автопилот, события.
    Больше здесь ничего быть не должно. Всё, что требует разбираться в
    настройках, живёт на отдельной странице и по умолчанию скрыто —
    расширенные настройки нужны редко, а путают постоянно.
  -->
  <header class="popupHead">
    <span class="brandMark" aria-hidden="true">T</span>
    <div class="grow"><strong>ThreadSense AI</strong><div class="tiny muted">Умный помощник для Threads</div></div>
    <button class="githubTop" id="openGitHub" title="Основной репозиторий ThreadSense AI">GITHUB ↗</button>
    <span class="statusPill"><span class="dot" id="dot"></span><span id="statusLine">загрузка…</span></span>
  </header>

  <section class="popupUpdate hidden" id="popupUpdate" aria-live="polite">
    <div class="updateCopy"><strong id="popupUpdateTitle">Доступна новая версия</strong><span id="popupUpdateText">Готовый ZIP уже на GitHub</span></div>
    <button class="updateDownload" id="downloadUpdatePopup">Скачать</button>
    <button class="updateDismiss" id="dismissUpdatePopup" title="Напомнить позже" aria-label="Напомнить позже">×</button>
  </section>

  <div id="alert" class="alert hidden"></div>
  <div id="setup" class="setupCard hidden"></div>

  <!-- 1. Режим -->
  <section class="card presetSection">
    <div class="sectionLabel"><span>Темп работы</span><small id="modeHint">Можно изменить в любой момент</small></div>
    <div class="presets" id="presets"></div>
  </section>

  <!-- 2. Старт-стоп -->
  <button class="bigStart" id="power"><span>Запустить агента</span><small>Только чтение и черновики, без лайков</small></button>

  <!-- 3. Что сделано сегодня -->
  <section class="card stats activityCard">
    <div class="sectionLabel"><span>Сегодня</span><small id="warmupLine"></small></div>
    <div class="statRow">
      <span class="muted">Комментарии</span>
      <strong class="mono right" id="dayCount">0 / 0</strong>
    </div>
    <div class="bar" id="dayBar"><i style="width:0%"></i></div>

    <div class="statRow" style="margin-top:8px">
      <span class="muted">Посты</span>
      <strong class="mono right" id="dayPosts">0 / 0</strong>
    </div>
    <div class="bar" id="postBar"><i style="width:0%"></i></div>

    <div class="grid3" style="margin-top:10px">
      <div><span class="tiny dim">лайков</span><strong class="mono" id="dayLikes">0</strong></div>
      <div><span class="tiny dim">просмотров</span><strong class="mono" id="dayViews">0</strong></div>
      <div><span class="tiny dim">потрачено</span><strong class="mono" id="daySpend">$0</strong></div>
    </div>

  </section>

  <!-- 4. Автопилот -->
  <section class="card autopilotCard">
    <div class="row">
      <div class="grow">
        <strong>Проверять черновики</strong>
        <div class="tiny muted" id="autopilotHint">Вы подтверждаете каждый текст</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="autopilot">
        <span></span>
      </label>
    </div>
    <button class="ghost sm hidden" id="openQueue">Открыть очередь (<span id="queueCount">0</span>)</button>
  </section>

  <!-- 5. События -->
  <section class="log eventCard">
    <div class="row">
      <strong class="grow">Последние события</strong>
      <button class="ghost sm" id="openLog">Открыть историю</button>
    </div>
    <div id="logList"></div>
  </section>

  <footer>
    <button class="secondary grow" id="openOptions">Настроить агента</button>
    <button class="iconBtn" id="openThreads" title="Открыть Threads">↗</button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
